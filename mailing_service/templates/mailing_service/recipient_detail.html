{% extends 'mailing_service/base.html' %}
{% block title %}{{ recipient.email }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Получатель</h1>
    <a href="{% url 'mailing_service:recipient_list' %}" class="btn btn-outline-secondary">Назад</a>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <dl class="row mb-0">
            <dt class="col-sm-3">Email</dt><dd class="col-sm-9">{{ recipient.email }}</dd>
            <dt class="col-sm-3">Ф.И.О.</dt><dd class="col-sm-9">{{ recipient.full_name }}</dd>
            <dt class="col-sm-3">Комментарий</dt><dd class="col-sm-9">{{ recipient.comment|default:"—"|linebreaksbr }}</dd>
        </dl>
    </div>
    <div class="card-footer d-flex gap-2">
        <a href="{% url 'mailing_service:recipient_update' recipient.pk %}" class="btn btn-primary">Изменить</a>
        <a href="{% url 'mailing_service:recipient_delete' recipient.pk %}" class="btn btn-outline-danger">Удалить</a>
    </div>
</div>
{% endblock %}
