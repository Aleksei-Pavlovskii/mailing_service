{% extends 'mailing_service/base.html' %}
{% block title %}Удаление сообщения{% endblock %}

{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
<div class="card shadow-sm border-danger"><div class="card-body">
    <h1 class="h4 text-danger mb-3">Удалить сообщение?</h1>
    <p>Вы удаляете сообщение <strong>«{{ object.subject }}»</strong>. Действие необратимо.</p>
    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'mailing_service:message_list' %}" class="btn btn-outline-secondary">Отмена</a>
        </div>
    </form>
</div></div>
</div></div>
{% endblock %}
