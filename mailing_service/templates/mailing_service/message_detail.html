{% extends 'mailing_service/base.html' %}
{% block title %}{{ email_message.subject }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Сообщение</h1>
    <a href="{% url 'mailing_service:message_list' %}" class="btn btn-outline-secondary">Назад</a>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <h2 class="h5">{{ email_message.subject }}</h2>
        <hr>
        <div class="text-body">{{ email_message.body_message|linebreaksbr }}</div>
    </div>
    <div class="card-footer d-flex gap-2">
        <a href="{% url 'mailing_service:message_update' email_message.pk %}" class="btn btn-primary">Изменить</a>
        <a href="{% url 'mailing_service:message_delete' email_message.pk %}" class="btn btn-outline-danger">Удалить</a>
    </div>
</div>
{% endblock %}
