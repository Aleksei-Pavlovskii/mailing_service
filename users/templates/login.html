{% extends 'mailing_service/base.html' %}
{% block content %}
<div class="container">
    <form class="row" method="post" enctype="multipart/form-data">
        <div class="col-6">
            <div class="card">
                <div class="card-body">
                    {% csrf_token %}
                    {{ form.as_p }}
                </div>
                <button type="submit" class="btn btn-primary">
                    Войти
                </button>
                <div class="mt-3 text-center">
                    <a href="{% url 'users:password_reset' %}">Забыли пароль?</a>
                </div>
            </div>
        </div>
    </form>
</div>
{% endblock %}
