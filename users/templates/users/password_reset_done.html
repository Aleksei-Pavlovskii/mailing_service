{% extends 'mailing_service/base.html' %}
{% block title %}Письмо отправлено{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm text-center">
            <div class="card-body p-5">
                <div class="text-success mb-3"><i class="bi bi-envelope-check fs-1"></i></div>
                <h1 class="h4 mb-3">Письмо отправлено</h1>
                <p class="text-muted mb-4">
                    Если аккаунт с таким email существует, мы отправили на него ссылку для сброса пароля.
                    Проверьте почту (и папку «Спам»).
                </p>
                <a href="{% url 'users:login' %}" class="btn btn-primary">Вернуться ко входу</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
